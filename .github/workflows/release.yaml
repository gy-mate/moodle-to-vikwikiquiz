name: Publish new release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  attach-pyz:
    name: Attach zipapp to the release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.13

      - name: Install shiv
        run: uv tool install shiv

      - name: Build zipapp
        run: shiv --entry-point moodle_to_vikwikiquiz.main:main --output-file moodle-to-vikwikiquiz.pyz --reproducible .

      - name: Attach the generated zipapp
        uses: svenstaro/upload-release-action@v2
        with:
          file: moodle-to-vikwikiquiz.pyz
          overwrite: true
          asset_name: moodle-to-vikwikiquiz_$tag.pyz

  pypi-publish:
    name: Publish package to PyPI

    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Publish
        run: uv publish
